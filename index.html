<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CatWars.io - Evolution</title>
    
    <!-- EMOJI FAVICON (Kočka v záložce) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R74QC0ZMG5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-R74QC0ZMG5');
    </script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #121c26; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none;
        }
        canvas { display: block; }
        
        /* Hlavní UI prvky */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 28, 38, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: auto; z-index: 100;
        }
        
        #game-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: none; flex-direction: column;
            justify-content: space-between; padding: 20px; box-sizing: border-box;
        }

        .stats-bar { position: absolute; top: 20px; left: 20px; display: flex; gap: 15px; }
        .stat-box { background: rgba(0,0,0,0.7); border: 2px solid #555; padding: 8px 15px; border-radius: 10px; color: white; font-weight: bold; font-size: 18px; text-shadow: 1px 1px 2px #000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .gem-text { color: #00d4ff; }
        
        /* Bary (XP, HP) */
        #xp-bar-container {
            width: 50%; max-width: 600px; height: 25px; background: rgba(0,0,0,0.6);
            border-radius: 12px; border: 3px solid #444; overflow: hidden; position: relative;
        }
        #xp-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #f39c12 0%, #f1c40f 100%); transition: width 0.2s; }
        #xp-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px black; }
        
        /* Tlačítka */
        button.btn-main {
            margin: 10px; padding: 15px 30px; font-size: 20px; cursor: pointer;
            background: #f39c12; color: #111; border: none; border-radius: 10px;
            font-weight: bold; box-shadow: 0 4px 0 #d68910; transition: all 0.1s;
        }
        button.btn-main:hover { background: #f1c40f; transform: translateY(2px); box-shadow: 0 2px 0 #d68910; }
        button.btn-main:active { transform: translateY(4px); box-shadow: none; }
        button.btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Login Inputy */
        .login-input {
            margin: 8px; padding: 12px; font-size: 18px; border-radius: 10px;
            border: 2px solid #555; background: #2c3e50; color: white; width: 80%;
            text-align: center; outline: none;
        }

        /* Bannery s obrázky */
        .game-art-banner {
            margin-bottom: 15px; overflow: hidden; border-radius: 12px; border: 2px solid #34495e;
            background: linear-gradient(135deg, #1a252f 0%, #2c3e50 100%);
            min-height: 180px; display: flex; align-items: center; justify-content: center; position: relative;
        }
        .game-art-banner img { width: 100%; display: block; }
        .art-fallback { position: absolute; color: #f39c12; font-weight: 900; font-size: 32px; text-shadow: 2px 2px 0 #000; display: none; }

        /* Encyklopedie */
        #encyclopedia {
            position: absolute; top: 5%; left: 5%; width: 90%; height: 90%;
            background: #2c3e50; border: 4px solid #f39c12; border-radius: 20px;
            display: none; flex-direction: column; z-index: 200; pointer-events: auto;
        }
        .enc-header { display: flex; justify-content: space-between; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 16px 16px 0 0; }
        .enc-tabs { display: flex; gap: 10px; }
        .enc-tab { padding: 10px 20px; background: #34495e; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .enc-tab.active { background: #f39c12; color: #111; }
        .enc-content { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card { background: #34495e; border: 2px solid #555; border-radius: 12px; padding: 15px; text-align: center; color: white; }
        .card img { width: 80px; height: 80px; object-fit: contain; }
        .card.locked { background: #1a252f; opacity: 0.7; }
        .upgrade-btn { margin-top: 10px; padding: 5px; background: #00d4ff; border: none; border-radius: 5px; width: 100%; font-weight: bold; cursor: pointer; }

        /* Dash a upozornění */
        #dash-container { position: absolute; bottom: 80px; right: 20px; width: 60px; height: 60px; background: rgba(0,0,0,0.5); border: 2px solid #555; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #dash-fill { position: absolute; bottom: 0; width: 100%; height: 100%; background: #00d4ff; opacity: 0.6; }
        #boss-alert { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: #e74c3c; color: white; padding: 15px 40px; border-radius: 50px; font-size: 30px; font-weight: 900; display: none; z-index: 60; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.1); } }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <!-- PŘIHLAŠOVACÍ OBRAZOVKA -->
    <div id="login-screen" class="overlay" style="z-index: 300; backdrop-filter: blur(8px);">
        <div style="background: #1a252f; border: 4px solid #f39c12; border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.8); max-width: 500px; width: 90%;">
            <div class="game-art-banner">
                <div class="art-fallback">CATWARS.IO</div>
                <img src="https://raw.githubusercontent.com/davidmalina79-cell/catwars.io/main/CatWars.png" alt="CatWars Banner" onerror="this.style.display='none'; this.parentElement.querySelector('.art-fallback').style.display='block';">
            </div>
            <p style="color: #aaa; font-size: 16px; margin-bottom: 15px; font-weight: bold; text-transform: uppercase;">Game Login</p>
            <div id="login-error" style="color: #e74c3c; margin-bottom: 10px; font-weight: bold;"></div>
            <input type="text" id="login-nick" class="login-input" placeholder="Nickname" autocomplete="off">
            <input type="password" id="login-pass" class="login-input" placeholder="Password">
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
                <button class="btn-main" onclick="window.loginWithPassword()">Login</button>
                <button class="btn-main" onclick="window.registerWithPassword()" style="background: #3498db; box-shadow: 0 4px 0 #2980b9;">Register</button>
            </div>
            <div style="color: #555; margin: 15px 0; font-weight: bold;">──────── OR ────────</div>
            <button class="btn-main" onclick="window.loginWithGoogle()" style="background: #e74c3c; box-shadow: 0 4px 0 #c0392b; width: 90%;">🔴 Login with Google</button>
            <button class="btn-main" onclick="window.loginAsGuest()" style="background: #95a5a6; box-shadow: 0 4px 0 #7f8c8d; width: 90%;">👤 Play as Guest</button>
        </div>
    </div>

    <!-- HLAVNÍ MENU -->
    <div id="main-menu" class="overlay" style="display: none;">
        <div style="position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; align-items: flex-end; z-index: 10;">
            <div id="auth-status-text" style="color: #aaa; font-size: 14px; margin-bottom: 5px; font-weight: bold;">Playing as: ...</div>
            <button id="auth-action-btn" class="btn-main" onclick="window.logout()" style="font-size: 14px; padding: 8px 15px; margin: 0;">Logout</button>
        </div>
        <div style="background: #1a252f; border: 4px solid #f39c12; border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.8); max-width: 600px; width: 95%;">
            <div class="game-art-banner" style="min-height: 220px;">
                <div class="art-fallback">CATWARS.IO</div>
                <img src="https://raw.githubusercontent.com/davidmalina79-cell/catwars.io/main/CatWars.png" alt="CatWars Banner" onerror="this.style.display='none'; this.parentElement.querySelector('.art-fallback').style.display='block';">
            </div>
            <h1 style="font-size: 42px; margin-bottom: 5px;">🐾 CatWars.io 🐾</h1>
            <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;">
                <div class="stat-box">Kills: <span id="mm-kills">0</span></div>
                <div class="stat-box">Max Lv: <span id="mm-level">1</span></div>
                <div class="stat-box gem-text">💎 <span id="mm-gems">0</span></div>
            </div>
            <button class="btn-main" onclick="startGame()" style="font-size: 28px; width: 100%; max-width: 400px;">▶️ PLAY GAME</button>
            <div style="display: flex; gap: 10px; justify-content: center; width: 100%; margin-top: 10px;">
                <button class="btn-main" onclick="openEncyclopedia('cats')" style="background: #3498db; flex: 1;">🐱 UPGRADES</button>
                <button class="btn-main" onclick="openEncyclopedia('dogs')" style="background: #9b59b6; flex: 1;">🐶 BESTIARY</button>
            </div>
        </div>
    </div>

    <!-- OBRAZOVKA SMRTI -->
    <div id="death-screen" class="overlay" style="display: none; background: rgba(0, 0, 0, 0.8); z-index: 150;">
        <div style="background: #2c3e50; border: 4px solid #e74c3c; border-radius: 20px; padding: 30px; text-align: center; max-width: 400px;">
            <h1 style="color: #e74c3c; font-size: 40px;">YOU DIED!</h1>
            <p style="font-size: 18px; color: #ddd;">Continue your journey?</p>
            <p style="font-size: 14px; color: #f39c12; font-weight: bold;">Penalty: -2 Levels</p>
            <p style="font-size: 16px; color: #fff; margin: 15px 0; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px;">Your Gems: <span id="ds-current-gems">0</span> 💎</p>
            <button id="btn-revive-gem" class="btn-main" onclick="reviveWithGems()" style="background: #00d4ff; width: 100%;">💎 Revive (Cost: <span id="revive-cost">0</span>)</button>
            <button id="btn-revive-ad" class="btn-main" onclick="reviveWithAd()" style="background: #2ecc71; width: 100%;">📺 Watch Ad to Revive (FREE)</button>
            <button class="btn-main" onclick="giveUp()" style="background: #95a5a6; width: 100%; margin-top: 15px;">🏠 Back to Menu</button>
        </div>
    </div>

    <!-- IN-GAME UI -->
    <div id="game-ui">
        <div class="stats-bar">
            <div class="stat-box">Kills: <span id="ui-kills">0</span></div>
            <div class="stat-box gem-text">💎 <span id="ui-gems">0</span></div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; margin-top: 10px;">
            <div id="level-text" style="color: white; font-weight: bold; margin-bottom: 5px;">Level 1: Kitten</div>
            <div id="xp-bar-container">
                <div id="xp-bar"></div>
                <div id="xp-text">0 / 50 XP</div>
            </div>
            <div id="hp-bar-container" style="width: 50%; max-width: 600px; height: 10px; background: rgba(0,0,0,0.6); border-radius: 5px; margin-top: 5px; overflow: hidden;">
                <div id="hp-bar" style="height: 100%; width: 100%; background: #e74c3c;"></div>
            </div>
        </div>
    </div>

    <div id="dash-container" style="display:none;"><div id="dash-fill"></div><span style="z-index:2; color:white;">⚡</span></div>
    <div id="boss-alert">⚠️ BOSS SPAWNED! ⚠️</div>
    <div id="level-up-text">LEVEL UP!</div>

    <div id="game-over" class="overlay" style="display: none;">
        <h1 style="color: #e74c3c;">WASTED</h1>
        <p style="color: white;">Kills: <span id="final-kills">0</span> | Gems: <span id="final-gems">0</span></p>
        <button class="btn-main" onclick="goToMenu()">Main Menu</button>
    </div>

    <script>
        /* --- DATA A STAVY --- */
        let prog = { maxCatLevel: 1, totalKills: 0, gems: 0, dogKills: {}, weaponUpgrades: {} };
        const CHEST_TYPES = {
            wood: { hp: 500, gems: [3, 6], color: '#6b4423', metal: '#7f8c8d', weight: 0.70 },
            iron: { hp: 1500, gems: [10, 18], color: '#7f8c8d', metal: '#bdc3c7', weight: 0.20 },
            gold: { hp: 4000, gems: [30, 60], color: '#d4af37', metal: '#f1c40f', weight: 0.08 },
            diamond: { hp: 10000, gems: [120, 250], color: '#00d4ff', metal: '#ffffff', weight: 0.02 }
        };

        const TIER_VISUALS = [
            { cat:"Kitten", dog:"Chihuahua", w:"stick", c:"#f5d49a", d:"#e8c89a", acc:"#c89060", pat:"none" },
            { cat:"House Cat", dog:"Pug", w:"stick", c:"#d4a574", d:"#d4a574", acc:"#8b6f47", pat:"stripes" },
            { cat:"Stray Cat", dog:"Dachshund", w:"dagger", c:"#c89060", d:"#8b4513", acc:"#5a3a1a", pat:"stripes" },
            { cat:"Alley Runt", dog:"Corgi", w:"dagger", c:"#2c2c34", d:"#e8c89a", acc:"#1a1a22", pat:"none" },
            { cat:"Fat Cat", dog:"Beagle", w:"shortsword", c:"#e8dcc4", d:"#d8a060", acc:"#6a4a2a", pat:"spots" },
            { cat:"Wildcat", dog:"Terrier", w:"shortsword", c:"#8b6f47", d:"#c4a060", acc:"#3a2a1a", pat:"stripes" },
            { cat:"Lynx", dog:"Poodle", w:"longsword", c:"#f0e5d0", d:"#ffffff", acc:"#d4a060", pat:"fluffy" },
            { cat:"Bobcat", dog:"Bulldog", w:"mace", c:"#d49a3f", d:"#c89060", acc:"#3a2a0a", pat:"spots" },
            { cat:"Cougar", dog:"Dalmatian", w:"morningstar", c:"#e8c8a8", d:"#ffffff", acc:"#333333", pat:"spots" },
            { cat:"Puma", dog:"Boxer", w:"katana", c:"#1a1a2e", d:"#a8753a", acc:"#0a0a14", pat:"mask" },
            { cat:"Leopard", dog:"Husky", w:"twin blades", c:"#d4a060", d:"#cccccc", acc:"#111111", pat:"spots" },
            { cat:"Jaguar", dog:"Doberman", w:"naginata", c:"#8b8b9a", d:"#222222", acc:"#8b4513", pat:"helm" },
            { cat:"Panther", dog:"Rottweiler", w:"broadsword", c:"#3a3a4e", d:"#3a2a1a", acc:"#1a1a22", pat:"eyepatch" },
            { cat:"Tiger", dog:"Mastiff", w:"battleaxe", c:"#e87f1f", d:"#8b6f47", acc:"#1a0a00", pat:"stripes" },
            { cat:"Lion", dog:"Wolfhound", w:"cutlass", c:"#daa520", d:"#888888", acc:"#8b6f00", pat:"mane" },
            { cat:"Dire Tiger", dog:"Dire Wolf", w:"staff", c:"#c4a060", d:"#444444", acc:"#5a3a1a", pat:"stripes" },
            { cat:"Smilodon", dog:"Hellhound", w:"warhammer", c:"#8b4513", d:"#5a1a1a", acc:"#ffd700", pat:"fangs" },
            { cat:"Mutant Cat", dog:"Cerberus", w:"scythe", c:"#a8324a", d:"#1a1a1a", acc:"#00ff00", pat:"horns" },
            { cat:"Cyborg Cat", dog:"Mutant Hound", w:"lightsaber", c:"#00d4ff", d:"#ff00ff", acc:"#0088aa", pat:"cyber" },
            { cat:"Ninja Cat", dog:"Cyborg Dog", w:"twin blades", c:"#1a1a2e", d:"#00d4ff", acc:"#000000", pat:"mask" },
            { cat:"Samurai Cat", dog:"Ninja Dog", w:"great katana", c:"#a8324a", d:"#1a1a2e", acc:"#ffd700", pat:"helm" },
            { cat:"Wizard Cat", dog:"Samurai Dog", w:"staff", c:"#6a3a8a", d:"#a8324a", acc:"#ffd700", pat:"hat" },
            { cat:"Dragon Cat", dog:"Wizard Dog", w:"dragonblade", c:"#4a8a3a", d:"#6a3a8a", acc:"#1a3a1a", pat:"scales" },
            { cat:"Demon Cat", dog:"Dragon Dog", w:"soul reaper", c:"#7a1a1a", d:"#4a8a3a", acc:"#3a0a0a", pat:"demon" },
            { cat:"Angel Cat", dog:"Demon Dog", w:"holy spear", c:"#fff8dc", d:"#7a1a1a", acc:"#ffd700", pat:"halo" },
            { cat:"Alien Cat", dog:"Alien Dog", w:"void blade", c:"#5a3a8a", d:"#33ff33", acc:"#1a0a3a", pat:"glow" },
            { cat:"Galaxy Cat", dog:"Galaxy Dog", w:"star scythe", c:"#3a5a9a", d:"#3a5a9a", acc:"#1a2a5a", pat:"galaxy" },
            { cat:"Universe Cat", dog:"Universe Dog", w:"colossus axe", c:"#2a4a3a", d:"#2a4a3a", acc:"#0a2a1a", pat:"tentacles" },
            { cat:"Cosmic Cat", dog:"Cosmic Dog", w:"godslayer", c:"#111111", d:"#111111", acc:"#00ffff", pat:"stars" },
            { cat:"God Cat", dog:"God Dog", w:"infinity blade", c:"#ffd700", d:"#ffd700", acc:"#ffffff", pat:"god" }
        ];

        const evolutions = TIER_VISUALS.map((t, i) => {
            let level = i + 1;
            let size = 20 + (level * 6); 
            let speed = Math.max(1.8, 4.8 - (level * 0.08)); 
            let nextXp = Math.floor(50 * Math.pow(1.35, i)); 
            let maxHp = Math.floor(100 * Math.pow(1.35, i)); 
            return { level, catName: t.cat, dogName: t.dog, weaponType: t.w, baseSize: size, speed, weaponLength: size * 2.5, nextXp, catColor: t.c, dogColor: t.d, accent: t.acc, pattern: t.pat, maxHp, playerDamage: maxHp, enemyDamage: Math.floor(maxHp * 0.2) };
        });

        /* --- LOGIKA HRY --- */
        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        let width, height; let mouseX = 0, mouseY = 0; let isMouseDown = false; let isRightMouseDown = false;
        const WORLD_SIZE = 6000; let gameState = 'menu';
        let playerRunData = { kills: 0, gems: 0, totalRunGems: 0 };
        let player, camera = { x: 0, y: 0 }, foods = [], enemies = [], particles = [], chests = [], droppedGems = [], damageNumbers = [];
        let bossSpawnTimer = 0, hitStop = 0;

        function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
        window.addEventListener('resize', resize); resize();
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('mousedown', (e) => { if(e.button === 0) isMouseDown = true; if(e.button === 2) isRightMouseDown = true; });
        window.addEventListener('mouseup', (e) => { if(e.button === 0) isMouseDown = false; if(e.button === 2) isRightMouseDown = false; });
        window.addEventListener('contextmenu', e => e.preventDefault());

        function saveProgress() { localStorage.setItem('catwars_save', JSON.stringify(prog)); updateMenuStats(); }
        function loadProgress() { let saved = localStorage.getItem('catwars_save'); if (saved) { prog = { ...prog, ...JSON.parse(saved) }; } updateMenuStats(); }
        function updateMenuStats() { document.getElementById('mm-kills').innerText = prog.totalKills; document.getElementById('mm-level').innerText = prog.maxCatLevel; document.getElementById('mm-gems').innerText = prog.gems; }

        function spawnChest() {
            let cx = Math.random() * WORLD_SIZE, cy = Math.random() * WORLD_SIZE;
            if (player) {
                let angle = Math.random() * Math.PI * 2; let dist = 800 + Math.random() * 500;
                cx = Math.max(100, Math.min(WORLD_SIZE-100, player.x + Math.cos(angle) * dist));
                cy = Math.max(100, Math.min(WORLD_SIZE-100, player.y + Math.sin(angle) * dist));
            }
            let rand = Math.random(), type = 'wood', cum = 0;
            for (let t in CHEST_TYPES) { cum += CHEST_TYPES[t].weight; if (rand <= cum) { type = t; break; } }
            chests.push({ x: cx, y: cy, type, hp: CHEST_TYPES[type].hp, maxHp: CHEST_TYPES[type].hp, size: type === 'diamond' ? 160 : 120 });
        }

        function startGame() {
            gameState = 'playing'; document.getElementById('main-menu').style.display = 'none'; document.getElementById('game-ui').style.display = 'flex';
            player = { x: WORLD_SIZE/2, y: WORLD_SIZE/2, level: 1, xp: 0, hp: evolutions[0].maxHp, angle: 0, attackTimer: 0, attackCooldown: 40, invuln: 120, dashTimer: 0, dashCooldown: 180, dashActive: 0 };
            playerRunData = { kills: 0, gems: 0, totalRunGems: 0 };
            foods = []; enemies = []; chests = []; droppedGems = []; particles = []; damageNumbers = [];
            for(let i=0; i<800; i++) foods.push({ x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, size: Math.random()*5+5, type: 'dot', color: '#8bc34a' });
            for(let i=0; i<25; i++) spawnChest();
            updateUI();
        }

        function updateUI() {
            let stats = evolutions[Math.min(player.level - 1, 29)];
            document.getElementById('level-text').innerText = `Level ${player.level}: ${stats.catName}`;
            document.getElementById('xp-bar').style.width = (player.xp / stats.nextXp * 100) + '%';
            document.getElementById('hp-bar').style.width = (player.hp / stats.maxHp * 100) + '%';
            document.getElementById('ui-kills').innerText = playerRunData.kills;
            document.getElementById('ui-gems').innerText = prog.gems + playerRunData.gems;
        }

        function gameLoop() {
            if (gameState !== 'playing') { requestAnimationFrame(gameLoop); return; }
            if (hitStop > 0) { hitStop--; requestAnimationFrame(gameLoop); return; }

            let stats = evolutions[Math.min(player.level - 1, 29)];
            let dx = mouseX - width/2, dy = mouseY - height/2;
            if (Math.hypot(dx, dy) > 20) player.angle = Math.atan2(dy, dx);

            let speed = player.dashActive > 0 ? stats.speed * 3.5 : stats.speed;
            if (player.dashActive > 0) player.dashActive--;
            player.x += Math.cos(player.angle) * speed; player.y += Math.sin(player.angle) * speed;
            player.x = Math.max(50, Math.min(WORLD_SIZE-50, player.x));
            player.y = Math.max(50, Math.min(WORLD_SIZE-50, player.y));

            camera.x = player.x - width/2; camera.y = player.y - height/2;

            if (isRightMouseDown && player.dashTimer <= 0) { player.dashActive = 12; player.dashTimer = player.dashCooldown; }
            if (player.dashTimer > 0) player.dashTimer--;
            if (player.invuln > 0) player.invuln--;

            // Útok
            if (isMouseDown && player.attackTimer <= 0) player.attackTimer = player.attackCooldown;
            if (player.attackTimer > 0) player.attackTimer--;

            // Truhly logic
            chests.forEach((c, i) => {
                if (player.attackTimer === Math.floor(player.attackCooldown * 0.7)) {
                    let dist = Math.hypot(player.x - c.x, player.y - c.y);
                    if (dist < stats.weaponLength + c.size) {
                        c.hp -= stats.playerDamage; hitStop = 3;
                        if (c.hp <= 0) {
                            let amt = Math.floor(Math.random() * 5) + 5;
                            for(let j=0; j<amt; j++) droppedGems.push({ x: c.x, y: c.y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 100 });
                            chests.splice(i, 1); spawnChest();
                        }
                    }
                }
            });

            // Gemy logic
            droppedGems.forEach((g, i) => {
                g.x += g.vx; g.y += g.vy; g.vx *= 0.95; g.vy *= 0.95;
                if (Math.hypot(player.x - g.x, player.y - g.y) < 100) { g.x += (player.x - g.x)*0.1; g.y += (player.y - g.y)*0.1; }
                if (Math.hypot(player.x - g.x, player.y - g.y) < 30) { droppedGems.splice(i, 1); playerRunData.gems++; updateUI(); }
            });

            draw();
            requestAnimationFrame(gameLoop);
        }

        function draw() {
            ctx.fillStyle = '#182825'; ctx.fillRect(0, 0, width, height);
            ctx.save(); ctx.translate(-camera.x, -camera.y);

            // Svět
            ctx.strokeStyle = '#333'; ctx.lineWidth = 10; ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            // Truhly
            chests.forEach(c => {
                ctx.fillStyle = CHEST_TYPES[c.type].color;
                ctx.fillRect(c.x - 40, c.y - 30, 80, 60);
                ctx.strokeStyle = '#000'; ctx.strokeRect(c.x - 40, c.y - 30, 80, 60);
            });

            // Gemy
            droppedGems.forEach(g => { ctx.fillStyle = '#00d4ff'; ctx.beginPath(); ctx.arc(g.x, g.y, 5, 0, Math.PI*2); ctx.fill(); });

            // Hráč
            ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
            if (player.invuln > 0 && Math.floor(Date.now()/100)%2) ctx.globalAlpha = 0.3;
            ctx.fillStyle = evolutions[player.level-1].catColor;
            ctx.beginPath(); ctx.arc(0, 0, evolutions[player.level-1].baseSize, 0, Math.PI*2); ctx.fill();
            ctx.restore();

            ctx.restore();
        }

        function showDeathScreen() {
            gameState = 'death_menu';
            prog.gems += playerRunData.gems;
            let cost = player.level * 10 + 20;
            document.getElementById('revive-cost').innerText = cost;
            document.getElementById('ds-current-gems').innerText = prog.gems;
            document.getElementById('death-screen').style.display = 'flex';
        }

        function reviveWithGems() {
            let cost = player.level * 10 + 20;
            if (prog.gems >= cost) { prog.gems -= cost; executeRevive(); }
        }

        function executeRevive() {
            player.level = Math.max(1, player.level - 2);
            player.hp = evolutions[player.level-1].maxHp;
            player.invuln = 180;
            document.getElementById('death-screen').style.display = 'none';
            gameState = 'playing'; updateUI();
        }

        function giveUp() {
            saveProgress(); location.reload();
        }

        loadProgress(); requestAnimationFrame(gameLoop);
    </script>
